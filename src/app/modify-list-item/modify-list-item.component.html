<div class="modify-list-item">
  <h2 *ngIf="!playerId">Add Player</h2>
  <h2 *ngIf="playerId">Update Player</h2>

  <form [formGroup]="playerForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="rank">Rank:</label>
      <input id="rank" formControlName="rank" type="number" />
      <div *ngIf="playerForm.get('rank')?.invalid && playerForm.get('rank')?.touched">
        <small class="error">Rank is required.</small>
      </div>
    </div>

    <div>
      <label for="firstName">First Name:</label>
      <input id="firstName" formControlName="firstName" type="text" />
      <div *ngIf="playerForm.get('firstName')?.invalid && playerForm.get('firstName')?.touched">
        <small class="error">First name is required.</small>
      </div>
    </div>

    <div>
      <label for="lastName">Last Name:</label>
      <input id="lastName" formControlName="lastName" type="text" />
      <div *ngIf="playerForm.get('lastName')?.invalid && playerForm.get('lastName')?.touched">
        <small class="error">Last name is required.</small>
      </div>
    </div>

    <div>
      <label for="country">Country:</label>
      <input id="country" formControlName="country" type="text" />
      <div *ngIf="playerForm.get('country')?.invalid && playerForm.get('country')?.touched">
        <small class="error">Country is required.</small>
      </div>
    </div>

    <div>
      <label for="average">Average:</label>
      <input id="average" formControlName="average" type="number" />
    </div>

    <button type="submit" [disabled]="playerForm.invalid">
      {{ playerId ? 'Update Player' : 'Add Player' }}
    </button>
  </form>
</div>
