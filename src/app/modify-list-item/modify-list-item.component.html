<div>
    <form [formGroup]="itemForm"(ngSubmit)="onSubmit()">

        <div>
            <label for ="rank">Rank</label>
            <input id = "rank" formControlName="rank" type="number" matInput [matTooltip]="'Enter the player rank'"/>
        </div>
        <div>
            <label for="firstName">First Name</label>
            <input id="firstName" formControlName="firstName" type="text" matInput [matTooltip]="'Enter the player first name'"/>
        </div>

        <div>

            <label for="lastName">Last Name</label>
            <input id="lastName" formControlName="lastName" type="text" matInput [matTooltip] =" 'Enter the player last name'"/>

        </div>
        <div>
            <label for="country">Country</label>
            <input id="country" formControlName="average" type="number" matInput [matTooltip] =" 'Enter the player country'"/>
        </div>
        <div>
            <button mat-raised-button type ="submit">Save</button>
            <button mat-raised-button type="button"(click)="resetForm()">Reset</button>
        </div>
    </form>
</div>
