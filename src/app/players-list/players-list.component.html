<div>
  <ng-container *ngFor="let player of players; let i= index">

    <app-players-list-item
      [player]="player"
      [even]="i%2==0">
        <div>
            <p>Full Name:{{{firstName:player.firstName,lastName:player.lastName}|fullName}}</p>
            <p>Debute Date: {{player.debuteDate| date:'longDate'}}</p>
            <p>Role: {{player.role|uppercase}}</p>
            <p>Salary:{{player.salary|currency:'CAD'}}</p>
        </div>

    </app-players-list-item>
      <div>
          <button (click)="editPlayer(player)">Edit</button>
          <button (click)="deletePlayer(player.rank)">Delete</button>
      </div>
  </ng-container>
</div>
